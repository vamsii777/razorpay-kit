name: CI

on:
  push:
    branches: [main, new-api]
    paths-ignore: ["**/*.md", "docs/**", "**/*.docc/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "**/*.docc/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Swift ${{ matrix.swift }} (${{ matrix.test && 'build + test' || 'build' }})
    # The new-api -> main PR would rebuild exactly what the push to new-api already built.
    if: github.event_name != 'pull_request' || github.head_ref != 'new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "5.10"
            test: false
          - swift: "6.0"
            test: true
          - swift: "latest"
            test: true
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift version key
        id: swift
        run: echo "version=$(swift --version 2>&1 | head -n1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache .build and SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Package@swift-*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-
      - name: Pin swift-system 1.5.0 (Swift 5.10)
        if: matrix.swift == '5.10'
        run: swift package resolve && swift package resolve swift-system --version 1.5.0
      - name: Build and test
        env:
          RUN_TESTS: ${{ matrix.test && '1' || '0' }}
        run: ./scripts/ci.sh
