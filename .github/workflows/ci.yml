name: CI

on:
  push:
    branches: [main, new-api]
  pull_request:
    branches: [main, new-api]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Swift ${{ matrix.swift }} (${{ matrix.test && 'build + test' || 'build' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "5.10"
            test: false
          - swift: "6.0"
            test: true
          - swift: "latest"
            test: true
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin swift-system 1.5.0 (Swift 5.10)
        if: matrix.swift == '5.10'
        run: swift package resolve && swift package resolve swift-system --version 1.5.0
      - name: Build and test
        env:
          RUN_TESTS: ${{ matrix.test && '1' || '0' }}
        run: ./scripts/ci.sh
